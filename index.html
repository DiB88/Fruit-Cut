<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ninja Fruit Slicer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Russo+One&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0f2027;
            font-family: 'Russo One', sans-serif;
            touch-action: none;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 20px;
            box-sizing: border-box;
        }

        #score {
            color: #fff;
            font-size: 32px;
            text-shadow: 2px 2px 4px #000, 0 0 10px #ffcc00;
            transition: transform 0.1s;
        }

        #score.negative {
            color: #ff4d4d;
            text-shadow: 2px 2px 4px #000, 0 0 10px #ff0000;
        }

        #menu, #game-over {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 32, 39, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            pointer-events: auto;
            z-index: 10;
            backdrop-filter: blur(5px);
        }

        #game-over {
            display: none;
            background: rgba(0, 0, 0, 0.9);
        }

        h1 {
            font-size: 42px;
            margin: 0 0 10px 0;
            text-align: center;
            color: #ffcc00;
            text-shadow: 0 0 20px #ff8c00;
        }

        p {
            font-size: 18px;
            text-align: center;
            margin: 10px 0;
        }

        .btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border: none;
            padding: 15px 40px;
            color: white;
            font-family: 'Russo One', sans-serif;
            font-size: 24px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
            transition: transform 0.1s;
            margin-top: 20px;
        }

        .btn:active {
            transform: scale(0.95);
        }

        input[type="text"] {
            width: 80%;
            max-width: 300px;
            padding: 12px;
            margin: 15px 0;
            border-radius: 10px;
            border: none;
            font-size: 18px;
            text-align: center;
            font-family: inherit;
        }

        #leaderboard {
            margin-top: 20px;
            text-align: left;
            font-size: 18px;
            line-height: 1.6;
            width: 80%;
            max-width: 300px;
        }

        .leader-item {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding: 5px 0;
        }

        #flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: red;
            opacity: 0;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.1s;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    <div id="flash"></div>

    <div id="ui-layer">
        <div id="score">Очки: 0</div>
    </div>

    <div id="menu">
        <h1>🥷 Ниндзя 🍉</h1>
        <p>Разрезай еду (+1) и избегай бомб (-1)</p>
        <p style="font-size: 14px; color: #aaa;">Проводи пальцем или мышкой по экрану</p>
        <button class="btn" id="start-btn">Играть</button>
    </div>

    <div id="game-over">
        <h1 style="color:#ff4d4d; font-size: 32px; margin-bottom: 5px;">Игра Окончена!</h1>
        <p>Ваш счет: <span id="final-score" style="color:#ffcc00; font-size: 28px;">0</span></p>
        <input type="text" id="player-name" placeholder="Ваше имя" maxlength="10">
        <button class="btn" style="font-size: 18px; padding: 10px 25px;" id="save-btn">Сохранить</button>
        <div id="leaderboard">
            <h3 style="text-align:center; margin-bottom: 5px; color: #ffcc00;">🏆 Топ игроков</h3>
            <div id="leader-list"></div>
        </div>
    </div>

    <script>
        // --- ИНИЦИАЛИЗАЦИЯ ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const menuEl = document.getElementById('menu');
        const gameOverEl = document.getElementById('game-over');
        const flashEl = document.getElementById('flash');
        const startBtn = document.getElementById('start-btn');
        const saveBtn = document.getElementById('save-btn');
        const finalScoreEl = document.getElementById('final-score');
        const playerNameInput = document.getElementById('player-name');
        const leaderList = document.getElementById('leader-list');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let gameState = 'menu'; // 'menu', 'playing', 'gameover'
        let score = 0;
        let objects = [];
        let particles = [];
        let missedCount = 0;
        let lastTime = 0;
        let spawnTimer = 0;
        let animationId;

        // --- УПРАВЛЕНИЕ ---
        let isSlicing = false;
        let mouseTrail = [];

        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function startSlice(e) {
            if (gameState !== 'playing') return;
            isSlicing = true;
            mouseTrail = [];
            mouseTrail.push(getPointerPos(e));
        }

        function moveSlice(e) {
            if (!isSlicing || gameState !== 'playing') return;
            mouseTrail.push(getPointerPos(e));
            if (mouseTrail.length > 15) mouseTrail.shift();
        }

        function endSlice() {
            isSlicing = false;
            mouseTrail = [];
        }

        // Обработчики для мыши и тача
        canvas.addEventListener('mousedown', startSlice);
        canvas.addEventListener('mousemove', moveSlice);
        window.addEventListener('mouseup', endSlice);
        
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startSlice(e); }, {passive: false});
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); moveSlice(e); }, {passive: false});
        window.addEventListener('touchend', endSlice);
        window.addEventListener('touchcancel', endSlice);

        // --- ТИПЫ ОБЪЕКТОВ ---
        const TYPES = {
            WATERMELON: { color: '#2e8b57', inner: '#ff3366', radius: 40, points: 1, isEdible: true, type: 'watermelon' },
            APPLE: { color: '#cc0000', inner: '#ffcccc', radius: 30, points: 1, isEdible: true, type: 'apple' },
            ORANGE: { color: '#ff8c00', inner: '#ffcc66', radius: 32, points: 1, isEdible: true, type: 'orange' },
            BOMB: { color: '#222', inner: '#666', radius: 35, points: -1, isEdible: false, type: 'bomb' }
        };

        class GameObject {
            constructor(typeKey) {
                this.type = TYPES[typeKey];
                this.x = Math.random() * (width - 100) + 50;
                this.y = height + 100;
                
                const targetX = Math.random() * width;
                const targetY = Math.random() * (height * 0.4) + 50;
                const speed = Math.random() * 2 + 12; // Скорость полета
                
                const angle = Math.atan2(targetY - this.y, targetX - this.x);
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                
                this.gravity = 0.3;
                this.rotation = Math.random() * Math.PI * 2;
                this.vr = (Math.random() - 0.5) * 0.2;
                this.sliced = false;
            }

            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.vy += this.gravity * dt;
                this.rotation += this.vr * dt;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                // Тень
                ctx.beginPath();
                ctx.arc(5, 5, this.type.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(0, 0, this.type.radius, 0, Math.PI * 2);
                
                if (this.type.type === 'bomb') {
                    ctx.fillStyle = this.type.color;
                    ctx.fill();
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#444';
                    ctx.stroke();
                    // Блик бомбы
                    ctx.beginPath();
                    ctx.arc(-this.type.radius/3, -this.type.radius/3, this.type.radius/4, 0, Math.PI*2);
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.fill();
                    // Фитиль
                    ctx.beginPath();
                    ctx.moveTo(0, -this.type.radius);
                    ctx.quadraticCurveTo(20, -this.type.radius - 20, 15, -this.type.radius - 40);
                    ctx.strokeStyle = '#888';
                    ctx.lineWidth = 4;
                    ctx.stroke();
                    // Искра
                    ctx.beginPath();
                    ctx.arc(15, -this.type.radius - 40, 8, 0, Math.PI*2);
                    ctx.fillStyle = '#ffcc00';
                    ctx.fill();
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#ffcc00';
                } else if (this.type.type === 'watermelon') {
                    ctx.fillStyle = this.type.color;
                    ctx.fill();
                    ctx.strokeStyle = '#1a4d2e';
                    ctx.lineWidth = 5;
                    for(let i=0; i<6; i++) {
                        ctx.beginPath();
                        ctx.moveTo(-this.type.radius + 10, -this.type.radius + i*15);
                        ctx.lineTo(this.type.radius - 10, -this.type.radius + i*15);
                        ctx.stroke();
                    }
                } else {
                    ctx.fillStyle = this.type.color;
                    ctx.fill();
                    // Блик
                    ctx.beginPath();
                    ctx.arc(-10, -10, this.type.radius/3, 0, Math.PI*2);
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        // --- ЧАСТИЦЫ ---
        class Particle {
            constructor(x, y, color, isBomb) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 10 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.gravity = 0.4;
                this.life = 1.0;
                this.decay = Math.random() * 0.03 + 0.02;
                this.color = isBomb ? (Math.random() > 0.5 ? '#ff9900' : '#ff0000') : color;
                this.size = Math.random() * 8 + 3;
            }
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.vy += this.gravity * dt;
                this.life -= this.decay * dt;
            }
            draw() {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        // --- ЛОГИКА РАЗРЕЗАНИЯ ---
        function checkSlices() {
            if (mouseTrail.length < 2) return;

            const p1 = mouseTrail[mouseTrail.length - 2];
            const p2 = mouseTrail[mouseTrail.length - 1];

            for (let i = objects.length - 1; i >= 0; i--) {
                const obj = objects[i];
                if (obj.sliced) continue;

                // Проверка пересечения линии и круга
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const len = Math.sqrt(dx*dx + dy*dy);
                if (len === 0) continue;

                let t = ((obj.x - p1.x) * dx + (obj.y - p1.y) * dy) / (len * len);
                t = Math.max(0, Math.min(1, t));
                const closestX = p1.x + t * dx;
                const closestY = p1.y + t * dy;

                const dist = Math.hypot(obj.x - closestX, obj.y - closestY);

                if (dist < obj.type.radius + 15) {
                    sliceObject(obj, i);
                }
            }
        }

        function sliceObject(obj, index) {
            obj.sliced = true;
            
            if (obj.type.isEdible) {
                score += obj.type.points;
                scoreEl.className = 'score-board'; // Сброс цвета
                for(let i=0; i<20; i++) particles.push(new Particle(obj.x, obj.y, obj.type.inner, false));
            } else {
                score += obj.type.points;
                scoreEl.className = 'score-board negative';
                setTimeout(() => { if(score >= 0) scoreEl.className = 'score-board'; }, 300);
                for(let i=0; i<30; i++) particles.push(new Particle(obj.x, obj.y, '#ff0000', true));
                
                // Эффект взрыва
                flashEl.style.opacity = 0.6;
                setTimeout(() => flashEl.style.opacity = 0, 100);
                document.body.style.transform = `translate(${Math.random()*10-5}px, ${Math.random()*10-5}px)`;
                setTimeout(() => document.body.style.transform = 'none', 50);
            }
            scoreEl.innerText = `Очки: ${score}`;
            objects.splice(index, 1);
        }

        // --- ИГРОВОЙ ЦИКЛ ---
        function spawnObject() {
            const rand = Math.random();
            let typeKey = 'WATERMELON';
            
            if (rand < 0.3) typeKey = 'BOMB';
            else if (rand < 0.55) typeKey = 'APPLE';
            else if (rand < 0.8) typeKey = 'ORANGE';

            objects.push(new GameObject(typeKey));
        }

        function gameLoop(timestamp) {
            if (gameState !== 'playing') return;

            const dt = Math.min((timestamp - lastTime) / 16.66, 3); // Защита от лагов
            lastTime = timestamp;

            // Отрисовка фона
            let bgGrad = ctx.createLinearGradient(0, 0, 0, height);
            bgGrad.addColorStop(0, '#0f2027');
            bgGrad.addColorStop(0.5, '#203a43');
            bgGrad.addColorStop(1, '#2c5364');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            // Спавн
            spawnTimer += dt;
            if (spawnTimer > 40) {
                spawnObject();
                spawnTimer = 0;
            }

            // Объекты
            for (let i = objects.length - 1; i >= 0; i--) {
                const obj = objects[i];
                obj.update(dt);
                obj.draw();

                if (obj.y > height + 100) {
                    if (obj.type.isEdible && !obj.sliced) {
                        missedCount++;
                        if (missedCount >= 3) {
                            endGame();
                            return;
                        }
                    }
                    objects.splice(i, 1);
                }
            }

            // Частицы
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update(dt);
                p.draw();
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Разрезание
            checkSlices();

            // Клинок
            if (isSlicing && mouseTrail.length > 1) {
                ctx.beginPath();
                ctx.moveTo(mouseTrail[0].x, mouseTrail[0].y);
                for (let i = 1; i < mouseTrail.length; i++) {
                    ctx.lineTo(mouseTrail[i].x, mouseTrail[i].y);
                }
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#00ffff';
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            animationId = requestAnimationFrame(gameLoop);
        }

        // --- УПРАВЛЕНИЕ ИГРОЙ ---
        function startGame() {
            menuEl.style.display = 'none';
            gameOverEl.style.display = 'none';
            gameState = 'playing';
            score = 0;
            missedCount = 0;
            objects = [];
            particles = [];
            mouseTrail = [];
            scoreEl.innerText = `Очки: 0`;
            scoreEl.className = 'score-board';
            playerNameInput.disabled = false;
            playerNameInput.value = '';
            lastTime = performance.now();
            if(animationId) cancelAnimationFrame(animationId);
            animationId = requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameState = 'gameover';
            finalScoreEl.innerText = score;
            gameOverEl.style.display = 'flex';
            updateLeaderboard();
        }

        // --- РЕЙТИНГ ---
        function saveScore() {
            if (playerNameInput.disabled) return; // Защита от двойного клика
            
            let name = playerNameInput.value.trim();
            if (name === '') name = 'Аноним';
            
            let leaderboard = JSON.parse(localStorage.getItem('ninjaLeaderboard')) || [];
            leaderboard.push({ name: name, score: score });
            
            leaderboard.sort((a, b) => b.score - a.score);
            leaderboard = leaderboard.slice(0, 5);
            
            localStorage.setItem('ninjaLeaderboard', JSON.stringify(leaderboard));
            updateLeaderboard();
            playerNameInput.value = '';
            playerNameInput.disabled = true;
        }

        function updateLeaderboard() {
            const leaderboard = JSON.parse(localStorage.getItem('ninjaLeaderboard')) || [];
            leaderList.innerHTML = '';
            
            if (leaderboard.length === 0) {
                leaderList.innerHTML = '<div style="text-align:center; color:#aaa;">Пока нет рекордов</div>';
                return;
            }

            leaderboard.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'leader-item';
                div.innerHTML = `<span>${index + 1}. ${item.name}</span> <span style="color:#ffcc00">${item.score}</span>`;
                leaderList.appendChild(div);
            });
        }

        // Привязка кнопок
        startBtn.addEventListener('click', startGame);
        saveBtn.addEventListener('click', saveScore);

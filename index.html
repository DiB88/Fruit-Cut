<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ninja Fruit Slicer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Russo+One&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: 'Russo One', sans-serif;
            touch-action: none; /* Отключаем скролл на телефонах */
            user-select: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 20px;
        }

        .score-board {
            color: #fff;
            font-size: 32px;
            text-shadow: 2px 2px 4px #000, 0 0 10px #ffcc00;
            pointer-events: none;
            transition: transform 0.1s;
        }

        .score-board.negative {
            color: #ff4d4d;
            text-shadow: 2px 2px 4px #000, 0 0 10px #ff0000;
        }

        #menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 26, 46, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            pointer-events: auto;
            transition: opacity 0.3s;
            backdrop-filter: blur(5px);
        }

        #menu.hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 48px;
            margin: 0 0 20px 0;
            text-align: center;
            color: #ffcc00;
            text-shadow: 0 0 20px #ff8c00;
        }

        .btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border: none;
            padding: 15px 40px;
            color: white;
            font-family: 'Russo One', sans-serif;
            font-size: 24px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        #game-over {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid #ffcc00;
            text-align: center;
            color: white;
            display: none;
            flex-direction: column;
            pointer-events: auto;
            width: 80%;
            max-width: 400px;
        }

        #game-over h2 { color: #ff416c; margin-top: 0; }

        input[type="text"] {
            width: 80%;
            padding: 10px;
            margin: 15px 0;
            border-radius: 10px;
            border: none;
            font-size: 18px;
            text-align: center;
            font-family: inherit;
        }

        #leaderboard {
            margin-top: 15px;
            text-align: left;
            font-size: 18px;
            line-height: 1.5;
            max-height: 150px;
            overflow-y: auto;
        }

        .leader-item {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding: 5px 0;
        }

        #flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: red;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    
    <div id="flash"></div>

    <div id="ui-layer">
        <div class="score-board" id="score">Очки: 0</div>
    </div>

    <div id="menu">
        <h1>🥷 Ниндзя Фруктов 🍉</h1>
        <p>Разрезай еду (+1) и избегай бомб (-1)</p>
        <p style="font-size: 14px; color: #aaa; margin-bottom: 20px;">Проводи пальцем или мышкой по экрану</p>
        <button class="btn" onclick="startGame()">Играть</button>
    </div>

    <div id="game-over">
        <h2>Игра Окончена!</h2>
        <p>Ваш счет: <span id="final-score" style="color:#ffcc00; font-size: 24px;">0</span></p>
        <input type="text" id="player-name" placeholder="Введите ваше имя" maxlength="10">
        <button class="btn" style="font-size: 18px; padding: 10px 20px;" onclick="saveScore()">Сохранить</button>
        <div id="leaderboard">
            <h3 style="text-align:center; margin-bottom: 10px;">🏆 Топ игроков</h3>
            <div id="leader-list"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const gameOverEl = document.getElementById('game-over');
        const menuEl = document.getElementById('menu');
        const flashEl = document.getElementById('flash');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let gameState = 'menu'; // menu, playing, gameover
        let score = 0;
        let objects = [];
        let particles = [];
        let missedCount = 0;
        let lastTime = 0;
        let spawnTimer = 0;

        // --- УПРАВЛЕНИЕ МЫШЬЮ/ПАЛЬЦЕМ (КЛИНОК) ---
        let isSlicing = false;
        let mouseTrail = [];
        
        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function handleStart(e) {
            if (gameState !== 'playing') return;
            isSlicing = true;
            mouseTrail = [];
            const pos = getPointerPos(e);
            mouseTrail.push({...pos, time: Date.now()});
        }

        function handleMove(e) {
            if (!isSlicing || gameState !== 'playing') return;
            const pos = getPointerPos(e);
            mouseTrail.push({...pos, time: Date.now()});
            if (mouseTrail.length > 10) mouseTrail.shift(); // Ограничиваем длину следа
        }

        function handleEnd() {
            isSlicing = false;
        }

        canvas.addEventListener('mousedown', handleStart);
        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('mouseup', handleEnd);
        canvas.addEventListener('mouseleave', handleEnd);
        
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleStart(e); }, {passive: false});
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e); }, {passive: false});
        canvas.addEventListener('touchend', handleEnd);
        canvas.addEventListener('touchcancel', handleEnd);

        // --- ИГРОВЫЕ ОБЪЕКТЫ ---
        const TYPES = {
            WATERMELON: { color: '#ff3366', inner: '#ff99aa', radius: 35, points: 1, isEdible: true, type: 'watermelon' },
            APPLE: { color: '#cc0000', inner: '#ffcccc', radius: 28, points: 1, isEdible: true, type: 'apple' },
            ORANGE: { color: '#ff8c00', inner: '#ffcc66', radius: 30, points: 1, isEdible: true, type: 'orange' },
            BOMB: { color: '#333', inner: '#666', radius: 30, points: -1, isEdible: false, type: 'bomb' }
        };

        class GameObject {
            constructor(typeKey) {
                this.type = TYPES[typeKey];
                this.x = Math.random() * (width - 200) + 100;
                this.y = height + 50;
                
                // Физика полета
                const targetX = Math.random() * width;
                const targetY = Math.random() * (height * 0.4) + 100;
                const speed = Math.random() * 4 + 5;
                
                const angle = Math.atan2(targetY - this.y, targetX - this.x);
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed - 5; // Компенсация гравитации
                
                this.gravity = 0.15;
                this.rotation = Math.random() * Math.PI * 2;
                this.vr = (Math.random() - 0.5) * 0.1;
                this.sliced = false;
            }

            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.vy += this.gravity * dt;
                this.rotation += this.vr * dt;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                // Тень
                ctx.beginPath();
                ctx.arc(0, 0, this.type.radius + 5, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fill();

                // Основной объект
                ctx.beginPath();
                ctx.arc(0, 0, this.type.radius, 0, Math.PI * 2);
                
                // Рисуем разные текстуры
                if (this.type.type === 'bomb') {
                    ctx.fillStyle = this.type.color;
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    // Фитиль
                    ctx.beginPath();
                    ctx.moveTo(0, -this.type.radius);
                    ctx.quadraticCurveTo(15, -this.type.radius - 20, 10, -this.type.radius - 30);
                    ctx.strokeStyle = '#ffaa00';
                    ctx.stroke();
                    // Искра
                    ctx.beginPath();
                    ctx.arc(10, -this.type.radius - 30, 5, 0, Math.PI*2);
                    ctx.fillStyle = '#ffff00';
                    ctx.fill();
                } else if (this.type.type === 'watermelon') {
                    ctx.fillStyle = this.type.color;
                    ctx.fill();
                    // Полоски
                    ctx.strokeStyle = '#006600';
                    ctx.lineWidth = 4;
                    for(let i=0; i<5; i++) {
                        ctx.beginPath();
                        ctx.moveTo(-this.type.radius, -this.type.radius + i*15);
                        ctx.lineTo(this.type.radius, -this.type.radius + i*15);
                        ctx.stroke();
                    }
                } else {
                    ctx.fillStyle = this.type.color;
                    ctx.fill();
                    // Блик
                    ctx.beginPath();
                    ctx.arc(-10, -10, this.type.radius/3, 0, Math.PI*2);
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        // --- ЧАСТИЦЫ (СОК) ---
        class Particle {
            constructor(x, y, color, isBomb) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.gravity = 0.2;
                this.life = 1.0;
                this.decay = Math.random() * 0.02 + 0.02;
                this.color = isBomb ? (Math.random() > 0.5 ? '#ff9900' : '#ff0000') : color;
                this.size = Math.random() * 5 + 3;
            }
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.vy += this.gravity * dt;
                this.life -= this.decay * dt;
            }
            draw() {
                ctx.globalAlpha = this.life;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        // --- ПРОВЕРКА ПЕРЕСЕЧЕНИЯ С КЛИНКОМ ---
        function checkSlices() {
            if (mouseTrail.length < 2) return;

            const p1 = mouseTrail[mouseTrail.length - 2];
            const p2 = mouseTrail[mouseTrail.length - 1];

            objects.forEach(obj => {
                if (obj.sliced) return;
                
                // Проверка пересечения линии клинка и круга объекта
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const len = Math.sqrt(dx*dx + dy*dy);
                if (len === 0) return;

                // Ближайшая точка на отрезке к центру круга
                let t = ((obj.x - p1.x) * dx + (obj.y - p1.y) * dy) / (len * len);
                t = Math.max(0, Math.min(1, t));
                const closestX = p1.x + t * dx;
                const closestY = p1.y + t * dy;

                const dist = Math.hypot(obj.x - closestX, obj.y - closestY);

                if (dist < obj.type.radius + 10) {
                    sliceObject(obj);
                }
            });
        }

        function sliceObject(obj) {
            obj.sliced = true;
            
            if (obj.type.isEdible) {
                score += obj.type.points;
                scoreEl.className = 'score-board';
                // Сок
                for(let i=0; i<15; i++) particles.push(new Particle(obj.x, obj.y, obj.type.inner, false));
            } else {
                score += obj.type.points;
                scoreEl.className = 'score-board negative';
                setTimeout(() => scoreEl.className = 'score-board', 300);
                // Взрыв
                for(let i=0; i<20; i++) particles.push(new Particle(obj.x, obj.y, '#ff0000', true));
                // Тряска и вспышка
                flashEl.style.opacity = 0.5;
                setTimeout(() => flashEl.style.opacity = 0, 100);
                document.body.style.transform = `translate(${Math.random()*10-5}px, ${Math.random()*10-5}px)`;
                setTimeout(() => document.body.style.transform = 'none', 50);
            }
            scoreEl.innerText = `Очки: ${score}`;
        }

        // --- ИГРОВОЙ ЦИКЛ ---
        function spawnObject() {
            const rand = Math.random();
            let typeKey = 'WATERMELON';
            
            // Шанс спавна бомбы ~25%
            if (rand < 0.25) {
                typeKey = 'BOMB';
            } else if (rand < 0.5) {
                typeKey = 'APPLE';
            } else if (rand < 0.75) {
                typeKey = 'ORANGE';
            }

            objects.push(new GameObject(typeKey));
        }

        function gameLoop(timestamp) {
            if (gameState !== 'playing') return;

            const dt = (timestamp - lastTime) / 16.66; // Нормализация под 60 FPS
            lastTime = timestamp;

            // Очистка экрана
            ctx.clearRect(0, 0, width, height);
            
            // Отрисовка фона (градиент)
            let bgGrad = ctx.createLinearGradient(0, 0, 0, height);
            bgGrad.addColorStop(0, '#0f2027');
            bgGrad.addColorStop(0.5, '#203a43');
            bgGrad.addColorStop(1, '#2c5364');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            // Спавн
            spawnTimer += dt;
            if (spawnTimer > 50) { // Каждые ~0.8 секунды
                spawnObject();
                spawnTimer = 0;
            }

            // Обновление объектов
            for (let i = objects.length - 1; i >= 0; i--) {
                const obj = objects[i];
                obj.update(dt);
                obj.draw();

                // Если объект упал вниз
                if (obj.y > height + 100 && !obj.sliced) {
                    if (obj.type.isEdible) {
                        missedCount++;
                        if (missedCount >= 3) {
                            endGame();
                        }
                    }
                    objects.splice(i, 1);
                } else if (obj.sliced) {
                    objects.splice(i, 1);
                }
            }

            // Обновление частиц
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update(dt);
                p.draw();
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Проверка разрезов
            checkSlices();

            // Отрисовка следа клинка
            if (isSlicing && mouseTrail.length > 1) {
                ctx.beginPath();
                ctx.moveTo(mouseTrail[0].x, mouseTrail[0].y);
                for (let i = 1; i < mouseTrail.length; i++) {
                    ctx.lineTo(mouseTrail[i].x, mouseTrail[i].y);
                }
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00ffff';
                ctx.stroke();
                ctx.shadowBlur = 0; // Сброс
            }

            requestAnimationFrame(gameLoop);
        }

        // --- ЛОГИКА ИГРЫ ---
        function startGame() {
            menuEl.classList.add('hidden');
            gameOverEl.style.display = 'none';
            gameState = 'playing';
            score = 0;
            missedCount = 0;
            objects = [];
            particles = [];
            mouseTrail = [];
            scoreEl.innerText = `Очки: 0`;
            scoreEl.className = 'score-board';
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameState = 'gameover';
            document.getElementById('final-score').innerText = score;
            gameOverEl.style.display = 'flex';
            updateLeaderboard();
        }

        // --- РЕЙТИНГ (LOCALSTORAGE) ---
        function saveScore() {
            const nameInput = document.getElementById('player-name').value.trim();
            const name = nameInput === '' ? 'Аноним' : nameInput;
            
            let leaderboard = JSON.parse(localStorage.getItem('ninjaLeaderboard')) || [];
            leaderboard.push({ name: name, score: score });
            
            // Сортируем по убыванию и оставляем топ-5
            leaderboard.sort((a, b) => b.score - a.score);
            leaderboard = leaderboard.slice(0, 5);
            
            localStorage.setItem('ninjaLeaderboard', JSON.stringify(leaderboard));
            updateLeaderboard();
            document.getElementById('player-name').value = '';
            document.getElementById('player-name').disabled = true;
        }

        function updateLeaderboard() {
            const leaderList = document.getElementById('leader-list');
            const leaderboard = JSON.parse(localStorage.getItem('ninjaLeaderboard')) || [];
            
            leaderList.innerHTML = '';
            leaderboard.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'leader-item';
                div.innerHTML = `<span>${index + 1}. ${item.name}</


<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ninja Fruit Slicer</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Russo+One&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    overflow: hidden;
    background: #101d2a;
    font-family: 'Russo One', sans-serif;
    touch-action: none;
    user-select: none;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
}

#ui {
    position: fixed;
    inset: 0;
    padding: 18px;
    pointer-events: none;
    z-index: 2;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.score-box {
    color: white;
    font-size: 27px;
    text-shadow: 0 0 12px #ffb700;
}

.missed-box {
    color: white;
    font-size: 19px;
    text-shadow: 0 0 10px red;
    text-align: right;
}

#missed {
    color: #ff5151;
}

#flash {
    position: fixed;
    inset: 0;
    background: #ff0000;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
}

.screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    background: rgba(7, 17, 28, 0.94);
    backdrop-filter: blur(12px);
    color: white;
    z-index: 10;
}

#gameOver {
    display: none;
    background: rgba(5, 9, 17, 0.96);
    overflow-y: auto;
}

.logo {
    font-size: clamp(38px, 8vw, 65px);
    color: #ffcc00;
    text-shadow: 0 0 25px #ff6600;
    margin-bottom: 12px;
}

.subtitle {
    color: #d4e2ed;
    font-size: 16px;
    line-height: 1.7;
    margin: 8px 0;
}

.hint {
    color: #8fa7b9;
    font-size: 13px;
    margin-top: 8px;
}

.btn {
    border: none;
    outline: none;
    margin-top: 25px;
    padding: 16px 48px;
    border-radius: 50px;
    color: white;
    font-family: inherit;
    font-size: 23px;
    background: linear-gradient(45deg, #ff416c, #ff4b2b);
    box-shadow: 0 5px 25px rgba(255, 65, 108, 0.4);
    cursor: pointer;
    transition: transform .15s, filter .15s;
}

.btn:active {
    transform: scale(.94);
    filter: brightness(1.2);
}

.secondary {
    margin-top: 12px;
    padding: 12px 30px;
    font-size: 17px;
    background: linear-gradient(45deg, #2878d0, #00b4db);
}

input {
    width: 85%;
    max-width: 300px;
    padding: 13px;
    margin-top: 18px;
    border: 2px solid #ffcc00;
    border-radius: 12px;
    outline: none;
    background: #172b3a;
    color: white;
    text-align: center;
    font-family: inherit;
    font-size: 17px;
}

input::placeholder {
    color: #9aabba;
}

#finalScore {
    color: #ffcc00;
    font-size: 42px;
    margin: 12px 0;
    text-shadow: 0 0 15px #ff9900;
}

#leaderboard {
    width: 90%;
    max-width: 330px;
    margin-top: 22px;
}

#leaderboard h3 {
    color: #ffcc00;
    font-size: 20px;
    margin-bottom: 12px;
}

.leader-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 5px;
    border-bottom: 1px solid rgba(255,255,255,.15);
    font-size: 14px;
}

.leader-item span:last-child {
    color: #ffcc00;
}

#saveStatus {
    color: #8cff9b;
    font-size: 12px;
    margin-top: 8px;
    min-height: 16px;
}

@media(max-height: 600px) {
    .logo { font-size: 38px; }
    .btn { margin-top: 12px; padding: 12px 35px; }
    #leaderboard { margin-top: 10px; }
    .subtitle { font-size: 13px; }
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<div id="flash"></div>

<div id="ui">
    <div class="top-bar">
        <div class="score-box">
            🍉 <span id="score">0</span>
        </div>
        <div class="missed-box">
            Пропущено:
            <span id="missed">0/3</span>
        </div>
    </div>
</div>

<!-- ГЛАВНОЕ МЕНЮ -->

<div class="screen" id="menu">

    <div class="logo">🥷 NINJA</div>

    <div style="font-size:42px;margin-bottom:12px">
        🍉 🍎 🍊
    </div>

    <p class="subtitle">
        Разрезай фрукты и набирай очки!<br>
        Избегай опасных бомб!
    </p>

    <p class="hint">
        👆 Проводи пальцем по экрану<br>
        🖱 Или используй мышку
    </p>

    <button class="btn" id="startBtn">
        ИГРАТЬ
    </button>

    <p class="hint" style="margin-top:25px">
        🍉 Фрукт = +1 очко<br>
        💣 Бомба = -1 очко
    </p>

</div>

<!-- ЭКРАН КОНЦА ИГРЫ -->

<div class="screen" id="gameOver">

    <div style="font-size:48px">💥</div>

    <h1 style="color:#ff5151;font-size:32px;margin-top:8px">
        ИГРА ОКОНЧЕНА!
    </h1>

    <p class="subtitle">Твой результат:</p>

    <div id="finalScore">0</div>

    <input
        type="text"
        id="playerName"
        maxlength="10"
        placeholder="Твоё имя"
        autocomplete="off"
    >

    <button class="btn secondary" id="saveBtn">
        СОХРАНИТЬ РЕКОРД
    </button>

    <div id="saveStatus"></div>

    <div id="leaderboard">
        <h3>🏆 ТОП ИГРОКОВ</h3>
        <div id="leaderList"></div>
    </div>

    <button class="btn" id="restartBtn">
        🔄 ИГРАТЬ СНОВА
    </button>

</div>

<script>

// ======================================
// ИНИЦИАЛИЗАЦИЯ
// ======================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const scoreEl = document.getElementById('score');
const missedEl = document.getElementById('missed');

const menu = document.getElementById('menu');
const gameOver = document.getElementById('gameOver');

const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const saveBtn = document.getElementById('saveBtn');

const finalScore = document.getElementById('finalScore');
const playerName = document.getElementById('playerName');
const leaderList = document.getElementById('leaderList');
const saveStatus = document.getElementById('saveStatus');
const flash = document.getElementById('flash');

let width = 0;
let height = 0;
let dpr = 1;

let gameState = 'menu';

let score = 0;
let missedCount = 0;

let objects = [];
let particles = [];
let floatingTexts = [];

let lastTime = 0;
let spawnTimer = 0;
let animationId = null;

let isSlicing = false;
let trail = [];

let shake = 0;
let saved = false;

// ======================================
// РАЗМЕРЫ CANVAS
// ======================================

function resize() {

    width = window.innerWidth;
    height = window.innerHeight;

    dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener('resize', resize);
resize();

// ======================================
// ТИПЫ ОБЪЕКТОВ
// ======================================

const TYPES = {

    watermelon: {
        radius: 39,
        color: '#23964f',
        inner: '#ff3266',
        points: 1,
        edible: true,
        emoji: '🍉'
    },

    apple: {
        radius: 30,
        color: '#e32929',
        inner: '#ffaaaa',
        points: 1,
        edible: true,
        emoji: '🍎'
    },

    orange: {
        radius: 31,
        color: '#ff941f',
        inner: '#ffd080',
        points: 1,
        edible: true,
        emoji: '🍊'
    },

    bomb: {
        radius: 34,
        color: '#222222',
        inner: '#ff3333',
        points: -1,
        edible: false,
        emoji: '💣'
    }
};

// ======================================
// ИГРОВОЙ ОБЪЕКТ
// ======================================

class GameObject {

    constructor(type) {

        this.type = TYPES[type];
        this.kind = type;

        this.x = Math.random() * Math.max(1, width - 100) + 50;
        this.y = height + 60;

        const targetX = Math.random() * width;
        const targetY = height * (0.15 + Math.random() * 0.25);

        const speed = 10 + Math.random() * 3;

        const angle = Math.atan2(
            targetY - this.y,
            targetX - this.x
        );

        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;

        this.gravity = 0.25;

        this.rotation = Math.random() * Math.PI * 2;
        this.vr = (Math.random() - 0.5) * 0.12;

        this.sliced = false;
    }

    update(dt) {

        this.x += this.vx * dt;
        this.y += this.vy * dt;

        this.vy += this.gravity * dt;

        this.rotation += this.vr * dt;
    }

    draw() {

        ctx.save();

        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        if (this.kind === 'bomb') {

            // Корпус бомбы

            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ff3333';

            ctx.beginPath();
            ctx.arc(0, 0, this.type.radius, 0, Math.PI * 2);

            ctx.fillStyle = '#222';
            ctx.fill();

            ctx.strokeStyle = '#666';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.shadowBlur = 0;

            // Блик

            ctx.beginPath();
            ctx.arc(-11, -11, 8, 0, Math.PI * 2);

            ctx.fillStyle = '#777';
            ctx.fill();

            // Фитиль

            ctx.beginPath();
            ctx.moveTo(0, -this.type.radius);
            ctx.quadraticCurveTo(15, -60, 15, -70);

            ctx.strokeStyle = '#aaa';
            ctx.lineWidth = 5;
            ctx.stroke();

            // Искра

            ctx.beginPath();
            ctx.arc(15, -70, 7, 0, Math.PI * 2);

            ctx.fillStyle = '#ffcc00';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff6600';
            ctx.fill();

        } else {

            // Тень

            ctx.beginPath();
            ctx.ellipse(5, 9, this.type.radius, this.type.radius * .85, 0, 0, Math.PI * 2);

            ctx.fillStyle = 'rgba(0,0,0,.25)';
            ctx.fill();

            // Фрукт

            ctx.beginPath();
            ctx.arc(0, 0, this.type.radius, 0, Math.PI * 2);

            ctx.fillStyle = this.type.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = this.type.color;
            ctx.fill();

            ctx.shadowBlur = 0;

            // Арбузная кожура

            if (this.kind === 'watermelon') {

                ctx.save();

                ctx.beginPath();
                ctx.arc(0, 0, this.type.radius, 0, Math.PI * 2);
                ctx.clip();

                ctx.strokeStyle = '#145d35';
                ctx.lineWidth = 5;

                for (let i = -3; i <= 3; i++) {

                    ctx.beginPath();
                    ctx.moveTo(-45, i * 13);
                    ctx.lineTo(45, i * 13);
                    ctx.stroke();
                }

                ctx.restore();

            } else {

                // Блик на фруктах

                ctx.beginPath();
                ctx.arc(-10, -10, 8, 0, Math.PI * 2);

                ctx.fillStyle = 'rgba(255,255,255,.4)';
                ctx.fill();

                // Хвостик

                ctx.beginPath();
                ctx.moveTo(0, -this.type.radius + 4);
                ctx.lineTo(4, -this.type.radius - 9);

                ctx.strokeStyle = '#5a8d38';
                ctx.lineWidth = 4;
                ctx.stroke();
            }
        }

        ctx.restore();
    }
}

// ======================================
// ЧАСТИЦЫ
// ======================================

class Particle {

    constructor(x, y, color, isBomb = false) {

        this.x = x;
        this.y = y;

        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 9 + 2;

        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;

        this.gravity = .35;

        this.life = 1;
        this.decay = .018 + Math.random() * .025;

        this.size = Math.random() * 7 + 3;

        this.color = isBomb
            ? (Math.random() > .5 ? '#ff3300' : '#ffcc00')
            : color;
    }

    update(dt) {

        this.x += this.vx * dt;
        this.y += this.vy * dt;

        this.vy += this.gravity * dt;

        this.life -= this.decay * dt;
    }

    draw() {

        ctx.save();

        ctx.globalAlpha = Math.max(0, this.life);

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);

        ctx.fillStyle = this.color;
        ctx.fill();

        ctx.restore();
    }
}

// ======================================
// ВСПЛЫВАЮЩИЙ ТЕКСТ
// ======================================

class FloatingText {

    constructor(x, y, text, color) {

        this.x = x;
        this.y = y;

        this.text = text;
        this.color = color;

        this.life = 1;
    }

    update(dt) {

        this.y -= 1.5 * dt;
        this.life -= .025 * dt;
    }

    draw() {

        ctx.save();

        ctx.globalAlpha = Math.max(0, this.life);

        ctx.font = 'bold 25px Russo One';
        ctx.textAlign = 'center';

        ctx.fillStyle = this.color;

        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;

        ctx.fillText(this.text, this.x, this.y);

        ctx.restore();
    }
}

// ======================================
// СОЗДАНИЕ ОБЪЕКТОВ
// ======================================

function spawnObject() {

    const rand = Math.random();

    let type;

    if (rand < .22) {
        type = 'bomb';
    } else if (rand < .48) {
        type = 'apple';
    } else if (rand < .73) {
        type = 'orange';
    } else {
        type = 'watermelon';
    }

    objects.push(new GameObject(type));
}

// ======================================
// РАЗРЕЗАНИЕ ОБЪЕКТОВ
// ======================================

function checkSlices() {

    if (trail.length < 2) return;

    const p1 = trail[trail.length - 2];
    const p2 = trail[trail.length - 1];

    const dx = p2.x - p1.x;
    const dy = p2.y - p1.y;

    const len2 = dx * dx + dy * dy;

    if (len2 === 0) return;

    for (let i = objects.length - 1; i >= 0; i--) {

        const obj = objects[i];

        if (obj.sliced) continue;

        let t = (
            (obj.x - p1.x) * dx +
            (obj.y - p1.y) * dy
        ) / len2;

        t = Math.max(0, Math.min(1, t));

        const closestX = p1.x + t * dx;
        const closestY = p1.y + t * dy;

        const distance = Math.hypot(
            obj.x - closestX,
            obj.y - closestY
        );

        if (distance < obj.type.radius + 14) {
            sliceObject(obj, i);
        }
    }
}

function sliceObject(obj, index) {

    obj.sliced = true;

    score += obj.type.points;

    scoreEl.textContent = score;

    if (obj.type.edible) {

        floatingTexts.push(
            new FloatingText(obj.x, obj.y, '+1', '#80ff9b')
        );

        for (let i = 0; i < 22; i++) {

            particles.push(
                new Particle(
                    obj.x,
                    obj.y,
                    obj.type.inner
                )
            );
        }

    } else {

        floatingTexts.push(
            new FloatingText(obj.x, obj.y, '-1 💥', '#ff4444')
        );

        for (let i = 0; i < 35; i++) {

            particles.push(
                new Particle(
                    obj.x,
                    obj.y,
                    '#ff3300',
                    true
                )
            );
        }

        shake = 12;

        flash.style.opacity = '.45';

        setTimeout(() => {
            flash.style.opacity = '0';
        }, 100);
    }

    objects.splice(index, 1);
}

// ======================================
// УПРАВЛЕНИЕ
// ======================================

function getPointerPosition(e) {

    const rect = canvas.getBoundingClientRect();

    return {
        x: (e.clientX - rect.left) * width / rect.width,
        y: (e.clientY - rect.top) * height / rect.height
    };
}

canvas.addEventListener('pointerdown', e => {

    if (gameState !== 'playing') return;

    e.preventDefault();

    isSlicing = true;

    trail = [getPointerPosition(e)];

    try {
        canvas.setPointerCapture(e.pointerId);
    } catch (_) {}
});

canvas.addEventListener('pointermove', e => {

    if (!isSlicing || gameState !== 'playing') return;

    e.preventDefault();

    trail.push(getPointerPosition(e));

    if (trail.length > 15) {
        trail.shift();
    }

    checkSlices();
});

function stopSlicing() {

    isSlicing = false;
    trail = [];
}

canvas.addEventListener('pointerup', stopSlicing);
canvas.addEventListener('pointercancel', stopSlicing);

window.addEventListener('blur', stopSlicing);

// ======================================
// ФОН
// ======================================

function drawBackground() {

    const gradient = ctx.createLinearGradient(0, 0, 0, height);

    gradient.addColorStop(0, '#101d2a');
    gradient.addColorStop(.5, '#1c3d50');
    gradient.addColorStop(1, '#102b42');

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);

    // Декоративные звёзды

    ctx.fillStyle = 'rgba(255,255,255,.12)';

    for (let i = 0; i < 25; i++) {

        const x = (i * 137) % width;
        const y = (i * 83) % height;

        ctx.beginPath();
        ctx.arc(x, y, 1.5, 0, Math.PI * 2);
        ctx.fill();
    }
}

// ======================================
// ИГРОВОЙ ЦИКЛ
// ======================================

function gameLoop(timestamp) {

    if (gameState !== 'playing') return;

    const dt = Math.min((timestamp - lastTime) / 16.666, 2.5);

    lastTime = timestamp;

    ctx.save();

    // Тряска экрана

    if (shake > .2) {

        ctx.translate(
            (Math.random() - .5) * shake,
            (Math.random() - .5) * shake
        );

        shake *= .85;

    } else {
        shake = 0;
    }

    drawBackground();

    // Появление фруктов

    spawnTimer += dt;

    if (spawnTimer > Math.max(22, 43 - score * .15)) {

        spawnObject();

        spawnTimer = 0;
    }

    // Объекты

    for (let i = objects.length - 1; i >= 0; i--) {

        const obj = objects[i];

        obj.update(dt);
        obj.draw();

        // Объект упал за экран

        if (obj.y > height + 90) {

            if (obj.type.edible && !obj.sliced) {

                missedCount++;

                missedEl.textContent = missedCount + '/3';

                if (missedCount >= 3) {

                    ctx.restore();

                    endGame();
                    return;
                }
            }

            objects.splice(i, 1);
        }
    }

    // Частицы

    for (let i = particles.length - 1; i >= 0; i--) {

        const p = particles[i];

        p.update(dt);
        p.draw();

        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }

    // Всплывающий текст

    for (let i = floatingTexts.length - 1; i >= 0; i--) {

        const t = floatingTexts[i];

        t.update(dt);
        t.draw();

        if (t.life <= 0) {
            floatingTexts.splice(i, 1);
        }
    }

    // След катаны

    if (isSlicing && trail.length > 1) {

        ctx.beginPath();

        ctx.moveTo(trail[0].x, trail[0].y);

        for (let i = 1; i < trail.length; i++) {
            ctx.lineTo(trail[i].x, trail[i].y);
        }

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.shadowBlur = 18;
        ctx.shadowColor = '#00ffff';

        ctx.stroke();

        ctx.shadowBlur = 0;
    }

    ctx.restore();

    animationId = requestAnimationFrame(gameLoop);
}

// ======================================
// СТАРТ ИГРЫ
// ======================================

function startGame() {

    if (animationId !== null) {
        cancelAnimationFrame(animationId);
        animationId = null;
    }

    menu.style.display = 'none';
    gameOver.style.display = 'none';

    gameState = 'playing';

    score = 0;
    missedCount = 0;

    objects = [];
    particles = [];
    floatingTexts = [];

    trail = [];
    isSlicing = false;

    spawnTimer = 0;
    shake = 0;

    saved = false;

    scoreEl.textContent = '0';
    missedEl.textContent = '0/3';

    playerName.value = '';
    playerName.disabled = false;

    saveBtn.disabled = false;
    saveBtn.style.opacity = '1';

    saveStatus.textContent = '';

    lastTime = performance.now();

    animationId = requestAnimationFrame(gameLoop);
}

// ======================================
// КОНЕЦ ИГРЫ
// ======================================

function endGame() {

    if (gameState !== 'playing') return;

    gameState = 'gameover';

    isSlicing = false;
    trail = [];

    if (animationId !== null) {
        cancelAnimationFrame(animationId);
        animationId = null;
    }

    finalScore.textContent = score;

    gameOver.style.display = 'flex';

    updateLeaderboard();
}

// ======================================
// СОХРАНЕНИЕ РЕКОРДОВ
// ======================================

function getLeaderboard() {

    try {

        const data = JSON.parse(
            localStorage.getItem('ninjaLeaderboard')
        );

        return Array.isArray(data) ? data : [];

    } catch (e) {

        return [];
    }
}

function saveScore() {

    if (saved || gameState !== 'gameover') return;

    let name = playerName.value.trim();

    if (!name) {
        name = 'Аноним';
    }

    name = name.slice(0, 10);

    const leaderboard = getLeaderboard();

    leaderboard.push({
        name: name,
        score: score
    });

    leaderboard.sort((a, b) => b.score - a.score);

    const topFive = leaderboard.slice(0, 5);

    try {

        localStorage.setItem(
            'ninjaLeaderboard',
            JSON.stringify(topFive)
        );

        saved = true;

        playerName.disabled = true;

        saveBtn.disabled = true;
        saveBtn.style.opacity = '.5';

        saveStatus.textContent = '✅ Рекорд сохранён!';

        updateLeaderboard();

    } catch (e) {

        saveStatus.textContent = 'Ошибка сохранения рекорда';
    }
}

// ======================================
// ТАБЛИЦА РЕКОРДОВ
// ======================================

function updateLeaderboard() {

    const leaderboard = getLeaderboard();

    leaderList.replaceChildren();

    if (leaderboard.length === 0) {

        const empty = document.createElement('div');

        empty.textContent = 'Пока нет рекордов. Стань первым!';

        empty.style.color = '#aaa';
        empty.style.textAlign = 'center';
        empty.style.fontSize = '13px';

        leaderList.appendChild(empty);

        return;
    }

    leaderboard.forEach((item, index) => {

        const div = document.createElement('div');

        div.className = 'leader-item';

        const name = document.createElement('span');
        const points = document.createElement('span');

        const medals = ['🥇', '🥈', '🥉', '4.', '5.'];

        name.textContent =
            medals[index] + ' ' + String(item.name || 'Аноним').slice(0, 10);

        points.textContent = Number(item.score) || 0;

        div.appendChild(name);
        div.appendChild(points);

        leaderList.appendChild(div);
    });
}

// ======================================
// КНОПКИ
// ======================================

startBtn.addEventListener('click', startGame);

restartBtn.addEventListener('click', startGame);

saveBtn.addEventListener('click', saveScore);

// Первоначальная таблица

updateLeaderboard();

</script>
